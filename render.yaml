services:
  # Backend Python FastAPI
  - type: web
    name: devinettelab-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RENDERER_URL
        value: https://devinettelab-renderer.onrender.com
    healthCheckPath: /api/health

  # Renderer Node.js Remotion
  - type: web
    name: devinettelab-renderer
    runtime: node
    buildCommand: cd renderer && npm install
    startCommand: cd renderer && npx ts-node src/server.ts
    envVars:
      - key: PORT
        value: "10000"
    disk:
      name: renders
      mountPath: /tmp/devinettelab-renders
      sizeGB: 5
